<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Completing payment…</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f6f7fb; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; color: #111; }
    .card { background: #fff; padding: 28px 32px; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.08); text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Completing your payment…</h2>
    <p>Please wait. Do not close this window.</p>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var api = (params.get('api') || '').replace(/\/$/, '');
      if (/\/api$/i.test(api)) {
        api = api.replace(/\/api$/i, '');
      }

      // Fallback if api param missing
      if (!api) {
        api = 'https://mdperves.info';
      }

      params.delete('api');
      // Ensure JSON is not forced — full browser navigation so Laravel can redirect to tenant dashboard
      params.delete('format');

      window.location.replace(api + '/api/public/eps/complete?' + params.toString());
    })();
  </script>
</body>
</html>
